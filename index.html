<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Sync Pro 🎸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TON_API_KEY",
            authDomain: "TON_PROJET.firebaseapp.com",
            projectId: "TON_PROJET_ID",
            storageBucket: "TON_PROJET.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const grid = document.getElementById('calendarGrid');
        const nameInput = document.getElementById('nameInput');
        let globalData = {};

        nameInput.value = localStorage.getItem('bandUserName') || "";
        nameInput.oninput = () => {
            localStorage.setItem('bandUserName', nameInput.value);
            renderCalendar();
        };

        const dates = Array.from({length: 30}, (_, i) => {
            const d = new Date();
            d.setDate(d.getDate() + i);
            return { id: d.toISOString().split('T')[0], label: d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) };
        });

        onSnapshot(doc(db, "band", "calendar"), (docSnap) => {
            globalData = docSnap.exists() ? docSnap.data() : {};
            renderCalendar();
        });

        window.resetData = async () => {
            if(confirm("Vider tout le calendrier ?")) {
                await setDoc(doc(db, "band", "calendar"), {});
            }
        };

        async function toggleDate(dateId) {
            const name = nameInput.value.trim();
            if (!name) return alert("Ton prénom ?");
            let users = globalData[dateId] || [];
            users = users.includes(name) ? users.filter(u => u !== name) : [...users, name];
            await setDoc(doc(db, "band", "calendar"), { ...globalData, [dateId]: users });
        }

        function renderCalendar() {
            grid.innerHTML = '';
            const myName = nameInput.value.trim();

            dates.forEach(date => {
                const users = globalData[date.id] || [];
                const isMe = myName && users.includes(myName);
                const isDrummerPresent = users.some(u => u.toLowerCase().includes('batteur') || u.toLowerCase().includes('drums'));
                
                const card = document.createElement('div');
                const stateClass = users.length >= 7 ? 'bg-green-600 border-green-400' : 
                                  users.length > 0 ? 'bg-slate-800 border-slate-700' : 'bg-slate-900 border-slate-800';

                card.className = `p-4 rounded-2xl border-2 transition-all active:scale-95 flex flex-col justify-between min-h-[130px] shadow-lg ${stateClass} ${isMe ? 'ring-2 ring-yellow-400' : ''}`;
                
                card.innerHTML = `
                    <div class="relative">
                        <div class="text-[10px] uppercase font-bold text-slate-400">${
