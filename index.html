<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Sync Pro 🤘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="text"] { font-size: 16px !important; }
        .modal { display: none; position: fixed; inset: 0; background: #020617; z-index: 50; overflow-y: auto; }
        .modal.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-white p-4 font-sans pb-24">
    
    <div id="mainPage" class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-black italic text-yellow-400 leading-none">BAND SYNC</h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-widest mt-1">90 jours • 19h-21h</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTopPage()" class="bg-yellow-400 text-black px-3 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">🏆 Top / Semaine</button>
            </div>
        </header>

        <section class="mb-6 bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-2xl">
            <div class="flex justify-between items-end mb-1">
                <label class="text-[10px] uppercase font-bold text-slate-500 ml-1">Qui vote ?</label>
                <button onclick="resetData()" class="text-[9px] text-slate-600 uppercase hover:text-red-500">Reset Local</button>
            </div>
            <input id="nameInput" type="text" placeholder="Entre ton prénom..." 
                class="w-full bg-transparent text-xl font-bold outline-none text-yellow-100 placeholder:text-slate-800">
        </section>

        <div id="calendarGrid" class="grid grid-cols-2 gap-3"></div>

        <div class="fixed bottom-4 left-0 right-0 px-4 pointer-events-none">
            <div class="max-w-md mx-auto bg-slate-900/90 backdrop-blur border border-slate-700 text-white text-[10px] text-center py-3 rounded-2xl font-bold uppercase tracking-tight shadow-2xl pointer-events-auto">
                1 clic = <span class="text-green-400">Présent</span> | 2 clics = <span class="text-red-400">Absent</span>
            </div>
        </div>
    </div>

    <div id="topPage" class="modal p-6">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black italic text-yellow-400">MEILLEURES DATES</h2>
                <button onclick="toggleTopPage()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase">Retour</button>
            </div>
            <div id="topResults" class="space-y-6">
                </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('calendarGrid');
        const nameInput = document.getElementById('nameInput');
        const topResults = document.getElementById('topResults');
        const topPage = document.getElementById('topPage');
        
        // Données : { "2023-10-12": { present: ["Tom"], absent: ["Julie"] } }
        let globalData = JSON.parse(localStorage.getItem('bandDataV3')) || {};

        nameInput.value = localStorage.getItem('bandUserName') || "";
        nameInput.oninput = () => {
            localStorage.setItem('bandUserName', nameInput.value);
            renderCalendar();
        };

        const dates = Array.from({length: 90}, (_, i) => {
            const d = new Date();
            d.setDate(d.getDate() + i);
            const weekNumber = getWeekNumber(d);
            return { 
                id: d.toISOString().split('T')[0], 
                label: d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }),
                week: `${d.getFullYear()}-W${weekNumber}`,
                fullLabel: d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })
            };
        });

        function getWeekNumber(d) {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }

        window.toggleDate = (dateId) => {
            const name = nameInput.value.trim();
            if (!name) return alert("Indique ton prénom !");

            if (!globalData[dateId]) globalData[dateId] = { present: [], absent: [] };
            
            const isPresent = globalData[dateId].present.includes(name);
            const isAbsent = globalData[dateId].absent.includes(name);

            if (!isPresent && !isAbsent) {
                globalData[dateId].present.push(name);
            } else if (isPresent) {
                globalData[dateId].present = globalData[dateId].present.filter(u => u !== name);
                globalData[dateId].absent.push(name);
            } else {
                globalData[dateId].absent = globalData[dateId].absent.filter(u => u !== name);
            }

            localStorage.setItem('bandDataV3', JSON.stringify(globalData));
            renderCalendar();
        };

        function renderCalendar() {
            grid.innerHTML = '';
            const myName = nameInput.value.trim();

            dates.forEach(date => {
                const dayData = globalData[date.id] || { present: [], absent: [] };
                const isMePresent = myName && dayData.present.includes(myName);
                const isMeAbsent = myName && dayData.absent.includes(myName);
                
                let borderClass = 'border-slate-800 bg-slate-900/50';
                if (isMePresent) borderClass = 'border-green-500 bg-green-500/10 ring-1 ring-green-500';
                if (isMeAbsent) borderClass = 'border-red-500 bg-red-500/10 ring-1 ring-red-500';

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border-2 transition-all active:scale-95 flex flex-col justify-between min-h-[120px] shadow-lg ${borderClass}`;
                
                card.innerHTML = `
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-500">${date.label}</div>
                        <div class="flex gap-3 mt-1">
                            <div class="text-xl font-black text-green-400">${dayData.present.length}<span class="text-[10px] ml-1 opacity-50 uppercase">Ok</span></div>
                            <div class="text-xl font-black text-red-500">${dayData.absent.length}<span class="text-[10px] ml-1 opacity-50 uppercase">No</span></div>
                        </div>
                    </div>
                    <div class="text-[9px] font-medium text-slate-400 mt-2">
                        <span class="text-green-500/80">${dayData.present.join(', ')}</span>
                        ${dayData.absent.length > 0 ? '<br><span class="text-red-500/60">Abs: ' + dayData.absent.join(', ') + '</span>' : ''}
                    </div>
                `;
                card.onclick = () => window.toggleDate(date.id);
                grid.appendChild(card);
            });
        }

        function toggleTopPage() {
            const isActive = topPage.classList.toggle('active');
            if (isActive) calculateBestDays();
        }

        function calculateBestDays() {
            topResults.innerHTML = '';
            const weeks = {};

            // Grouper par semaine
            dates.forEach(d => {
                if (!weeks[d.week]) weeks[d.week] = [];
                weeks[d.week].push(d);
            });

            for (const weekId in weeks) {
                let maxOk = -1;
                let winners = [];

                weeks[weekId].forEach(day => {
                    const okCount = (globalData[day.id]?.present || []).length;
                    if (okCount > 0) {
                        if (okCount > maxOk) {
                            maxOk = okCount;
                            winners = [day];
                        } else if (okCount === maxOk) {
                            winners.push(day);
                        }
                    }
                });

                if (winners.length > 0) {
                    const weekBlock = document.createElement('div');
                    weekBlock.className = "bg-slate-900 rounded-3xl p-5 border border-slate-800";
                    
                    let html = `<h3 class="text-slate-500 text-[10px] font-bold uppercase mb-3">Semaine ${weekId.split('-W')[1]}</h3>`;
                    
                    winners.forEach(w => {
                        const absCount = (globalData[w.id]?.absent || []).length;
                        html += `
                            <div class="flex justify-between items-center mb-2 last:mb-0 border-l-2 border-yellow-400 pl-3">
                                <div>
                                    <div class="font-bold text-white">${w.fullLabel}</div>
                                    <div class="text-[10px] text-slate-400">${(globalData[w.id]?.present || []).join(', ')}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-green-400 font-black text-lg">${maxOk} OK</div>
                                    ${absCount > 0 ? `<div class="text-red-500 text-[9px] font-bold">-${absCount} ABSENT(S)</div>` : ''}
                                </div>
                            </div>
                        `;
                    });
                    weekBlock.innerHTML = html;
                    topResults.appendChild(weekBlock);
                }
            }
            if(topResults.innerHTML === '') topResults.innerHTML = '<p class="text-center text-slate-600 mt-20">Aucun vote enregistré...</p>';
        }

        window.resetData = () => { if(confirm("Effacer tout ?")) { globalData = {}; localStorage.removeItem('bandDataV3'); renderCalendar(); } };

        renderCalendar();
    </script>
</body>
</html>
