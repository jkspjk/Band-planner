<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Sync Pro 🎸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Empêche le zoom auto sur iPhone quand on clique sur l'input */
        input[type="text"] { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-950 text-white p-4 font-sans pb-24">
    <div class="max-w-md mx-auto">
        
        <div class="flex justify-between items-start mb-6">
            <div>
                <h1 class="text-3xl font-black italic text-yellow-400 leading-none">BAND SYNC</h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-widest mt-1 text-left">Répètes 19h-21h • Mode Test</p>
            </div>
            <button onclick="window.resetData()" class="bg-slate-800 px-3 py-1 rounded-lg text-[10px] uppercase font-bold text-slate-500 hover:bg-red-900 hover:text-white transition-colors">Effacer</button>
        </div>

        <section class="mb-6 bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-2xl">
            <label class="text-[10px] uppercase font-bold text-slate-500 ml-1">Ton Prénom</label>
            <input id="nameInput" type="text" placeholder="Thomas, Julie..." 
                class="w-full bg-transparent text-xl font-bold outline-none text-yellow-100 placeholder:text-slate-800">
        </section>

        <div id="calendarGrid" class="grid grid-cols-2 gap-3">
            </div>

        <div class="fixed bottom-4 left-0 right-0 px-4">
            <div class="max-w-md mx-auto bg-yellow-400 text-black text-center py-3 rounded-2xl font-black shadow-2xl text-xs uppercase tracking-tighter">
                Tapote une date pour t'inscrire
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('calendarGrid');
        const nameInput = document.getElementById('nameInput');
        
        // Charger les données sauvegardées sur le téléphone
        let globalData = JSON.parse(localStorage.getItem('bandDataLocal')) || {};

        // Sauvegarder le nom automatiquement
        nameInput.value = localStorage.getItem('bandUserName') || "";
        nameInput.oninput = () => {
            localStorage.setItem('bandUserName', nameInput.value);
            renderCalendar();
        };

        // Générer les 30 prochains jours à partir d'aujourd'hui
        const dates = Array.from({length: 30}, (_, i) => {
            const d = new Date();
            d.setDate(d.getDate() + i);
            return { 
                id: d.toISOString().split('T')[0], 
                label: d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) 
            };
        });

        // Fonction pour vider les données
        window.resetData = () => {
            if(confirm("Vider ton planning local ?")) {
                globalData = {};
                localStorage.removeItem('bandDataLocal');
                renderCalendar();
            }
        };

        // Fonction pour s'ajouter/se retirer d'une date
        window.toggleDate = (dateId) => {
            const name = nameInput.value.trim();
            if (!name) {
                alert("Indique ton prénom en haut pour pouvoir cliquer !");
                return;
            }

            let users = globalData[dateId] || [];
            
            // On vérifie si le nom est déjà présent (en ignorant les majuscules)
            const index = users.findIndex(u => u.toLowerCase() === name.toLowerCase());

            if (index !== -1) {
                users.splice(index, 1); // On retire
            } else {
                users.push(name); // On ajoute
            }

            globalData[dateId] = users;
            localStorage.setItem('bandDataLocal', JSON.stringify(globalData));
            renderCalendar();
        };

        function renderCalendar() {
            if (!grid) return;
            grid.innerHTML = '';
            const myName = nameInput.value.trim().toLowerCase();

            dates.forEach(date => {
                const users = globalData[date.id] || [];
                const isMe = myName && users.some(u => u.toLowerCase() === myName);
                const isDrummerPresent = users.some(u => u.toLowerCase().includes('batteur') || u.toLowerCase().includes('drums'));
                
                // Style dynamique selon le nombre de personnes
                let stateClass = 'bg-slate-900 border-slate-800'; // Vide
                if (users.length >= 7) stateClass = 'bg-green-600 border-green-400';
                else if (users.length > 0) stateClass = 'bg-slate-800 border-slate-700';

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border-2 transition-all active:scale-95 flex flex-col justify-between min-h-[130px] shadow-lg ${stateClass} ${isMe ? 'ring-2 ring-yellow-400' : ''}`;
                
                card.innerHTML = `
                    <div class="relative">
                        <div class="text-[10px] uppercase font-bold text-slate-400">${date.label}</div>
                        <div class="text-2xl font-black">${users.length}<span class="text-sm opacity-40">/7</span></div>
                        ${users.length > 0 && !isDrummerPresent ? '<span class="absolute top-0 right-0 text-lg" title="Pas de batteur">🥁❌</span>' : ''}
                    </div>
                    <div class="text-[10px] font-medium italic text-slate-300 leading-tight">
                        ${users.length > 0 ? users.join(', ') : 'Libre'}
                    </div>
                `;

                card.onclick = () => window.toggleDate(date.id);
                grid.appendChild(card);
            });
        }

        // Lancer l'affichage au chargement
        renderCalendar();
    </script>
</body>
</html>
