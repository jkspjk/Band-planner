<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Planner 7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slot { transition: all 0.2s; user-select: none; }
        .slot.available { background-color: #22c55e; color: white; }
        .slot.busy { background-color: #ef4444; color: white; }
    </style>
</head>
<body class="bg-slate-900 text-white p-4 pb-20">
    <div class="max-w-md mx-auto">
        <header class="text-center my-6">
            <h1 class="text-3xl font-black tracking-tight text-yellow-400 italic">BAND SYNC 🤘</h1>
            <p class="text-slate-400 text-sm">Trouvez le créneau parfait pour les 7 !</p>
        </header>

        <div class="mb-6">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Qui es-tu ?</label>
            <select id="userSelect" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl appearance-none">
                <option>Batteur</option>
                <option>Bassiste</option>
                <option>Guitariste 1</option>
                <option>Guitariste 2</option>
                <option>Claviériste</option>
                <option>Chanteur</option>
                <option>Manager/Autre</option>
            </select>
        </div>

        <div class="grid grid-cols-3 gap-2" id="grid">
            </div>

        <div class="mt-8 bg-slate-800 rounded-2xl p-4 border border-slate-700">
            <h2 class="font-bold mb-2">Verdict du groupe :</h2>
            <div id="results" class="text-sm space-y-1 text-slate-300">
                </div>
        </div>
    </div>

    <script>
        const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
        const slots = ['Soirée (18h-20h)', 'Nuit (20h-23h)'];
        const grid = document.getElementById('grid');
        
        // Structure de données simple
        let myDispos = JSON.parse(localStorage.getItem('bandDispos')) || {};

        function renderGrid() {
            grid.innerHTML = '';
            days.forEach(day => {
                slots.forEach(time => {
                    const id = `${day}-${time}`;
                    const isAvail = myDispos[id] || false;
                    
                    const div = document.createElement('div');
                    div.className = `slot p-3 rounded-xl text-center text-xs font-bold flex flex-col justify-center h-20 shadow-lg ${isAvail ? 'available' : 'busy opacity-40'}`;
                    div.innerHTML = `<span>${day}</span><span class="opacity-70">${time}</span>`;
                    
                    div.onclick = () => {
                        myDispos[id] = !myDispos[id];
                        localStorage.setItem('bandDispos', JSON.stringify(myDispos));
                        renderGrid();
                    };
                    grid.appendChild(div);
                });
            });
        }

        renderGrid();
    </script>
</body>
</html>
