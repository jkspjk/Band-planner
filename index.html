<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Sync Pro 🤘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="text"] { font-size: 16px !important; }
        .modal { display: none; position: fixed; inset: 0; background: #020617; z-index: 50; overflow-y: auto; }
        .modal.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans pb-24">
    
    <div id="mainPage" class="max-w-xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-black italic text-yellow-400 leading-none">BAND SYNC</h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-widest mt-1">90 jours • 19h-21h</p>
            </div>
            <button onclick="toggleTopPage()" class="bg-yellow-400 text-black px-3 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">🏆 Top / Semaine</button>
        </header>

        <section class="mb-8 bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-2xl">
            <label class="text-[10px] uppercase font-bold text-slate-500 ml-1 text-left block">Qui vote ?</label>
            <input id="nameInput" type="text" placeholder="Ton prénom..." 
                class="w-full bg-transparent text-xl font-bold outline-none text-yellow-100 placeholder:text-slate-800">
        </section>

        <div class="grid grid-cols-7 gap-1 mb-2 px-1 text-center">
            <div class="text-[9px] font-bold text-slate-600 uppercase">Lun</div>
            <div class="text-[9px] font-bold text-slate-600 uppercase">Mar</div>
            <div class="text-[9px] font-bold text-slate-600 uppercase">Mer</div>
            <div class="text-[9px] font-bold text-slate-600 uppercase">Jeu</div>
            <div class="text-[9px] font-bold text-slate-600 uppercase">Ven</div>
            <div class="text-[9px] font-bold text-slate-600 uppercase">Sam</div>
            <div class="text-[9px] font-bold text-slate-600 uppercase">Dim</div>
        </div>

        <div id="calendarContainer" class="space-y-4"></div>

        <div class="fixed bottom-4 left-0 right-0 px-4 pointer-events-none">
            <div class="max-w-md mx-auto bg-slate-900/90 backdrop-blur border border-slate-700 text-white text-[10px] text-center py-3 rounded-2xl font-bold uppercase tracking-tight shadow-2xl pointer-events-auto">
                1 clic = <span class="text-green-400">OK</span> | 2 clics = <span class="text-red-400">ABS</span>
            </div>
        </div>
    </div>

    <div id="topPage" class="modal p-6">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black italic text-yellow-400 uppercase">Top Dates</h2>
                <button onclick="toggleTopPage()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase">Retour</button>
            </div>
            <div id="topResults" class="space-y-4 text-left"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURATION FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCPiwhmVw5ueWMjfqdXy5SyXszWYrnWeEU",
  authDomain: "band-planner-4c85a.firebaseapp.com",
  projectId: "band-planner-4c85a",
  storageBucket: "band-planner-4c85a.firebasestorage.app",
  messagingSenderId: "84077122024",
  appId: "1:84077122024:web:da8e368b73901dc324945d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const container = document.getElementById('calendarContainer');
        const nameInput = document.getElementById('nameInput');
        let globalData = {};

        nameInput.value = localStorage.getItem('bandUserName') || "";
        nameInput.oninput = () => localStorage.setItem('bandUserName', nameInput.value);

        // Génération des jours
        const getDatesData = () => {
            const days = [];
            for (let i = 0; i < 90; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                days.push({
                    id: d.toISOString().split('T')[0],
                    dateObj: new Date(d),
                    dayNum: d.getDate(),
                    monthLabel: d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }),
                    fullLabel: d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })
                });
            }
            return days;
        };

        const allDates = getDatesData();

        onSnapshot(doc(db, "band", "calendar"), (docSnap) => {
            globalData = docSnap.exists() ? docSnap.data() : {};
            renderCalendar();
        });

        window.toggleDate = async (dateId) => {
            const name = nameInput.value.trim();
            if (!name) return alert("Indique ton prénom !");
            if (!globalData[dateId]) globalData[dateId] = { present: [], absent: [] };
            let { present, absent } = globalData[dateId];
            if (!present.includes(name) && !absent.includes(name)) present.push(name);
            else if (present.includes(name)) { present = present.filter(u => u !== name); absent.push(name); }
            else absent = absent.filter(u => u !== name);
            await setDoc(doc(db, "band", "calendar"), { ...globalData, [dateId]: { present, absent } });
        };

        function renderCalendar() {
            container.innerHTML = '';
            const myName = nameInput.value.trim().toLowerCase();
            
            // Grouper par mois
            const months = {};
            allDates.forEach(d => {
                if (!months[d.monthLabel]) months[d.monthLabel] = [];
                months[d.monthLabel].push(d);
            });

            for (const monthLabel in months) {
                // En-tête mois
                const monthDiv = document.createElement('div');
                monthDiv.innerHTML = `<div class="text-xs font-black uppercase text-yellow-400 border-b border-yellow-400/20 pb-1 mb-3 mt-6 sticky top-0 bg-slate-950/90 py-2 z-10 text-left">${monthLabel}</div>`;
                
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-7 gap-1";

                // Calculer l'offset (Lundi = 0, Dimanche = 6)
                const firstDay = months[monthLabel][0].dateObj;
                let offset = firstDay.getDay() - 1; 
                if (offset === -1) offset = 6; // Dimanche

                // Ajouter les cases vides au début
                for (let i = 0; i < offset; i++) {
                    const empty = document.createElement('div');
                    empty.className = "h-[70px] bg-transparent";
                    grid.appendChild(empty);
                }

                // Ajouter les jours réels
                months[monthLabel].forEach(date => {
                    const data = globalData[date.id] || { present: [], absent: [] };
                    const isMeP = myName && data.present.some(u => u.toLowerCase() === myName);
                    const isMeA = myName && data.absent.some(u => u.toLowerCase() === myName);
                    
                    let style = 'bg-slate-900/40 border-slate-800';
                    if (isMeP) style = 'bg-green-500/20 border-green-500 ring-1 ring-green-500';
                    if (isMeA) style = 'bg-red-500/20 border-red-500 ring-1 ring-red-500';

                    const card = document.createElement('div');
                    card.className = `flex flex-col items-center justify-center p-1 rounded-lg border-2 transition-all active:scale-90 cursor-pointer min-h-[75px] ${style}`;
                    card.onclick = () => window.toggleDate(date.id);
                    card.innerHTML = `
                        <div class="text-lg font-black leading-none">${date.dayNum}</div>
                        <div class="mt-2 space-y-0.5">
                            <div class="text-[9px] font-black text-green-400 leading-none">${data.present.length} OK</div>
                            <div class="text-[9px] font-black text-red-500 leading-none">${data.absent.length} NO</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                monthDiv.appendChild(grid);
                container.appendChild(monthDiv);
            }
        }

        window.toggleTopPage = () => {
            const tp = document.getElementById('topPage');
            if(tp.classList.toggle('active')) calculateBest();
        };

        function calculateBest() {
            const results = document.getElementById('topResults');
            results.innerHTML = '';
            
            // Calcul par semaine glissante (7 jours à partir du lundi)
            const weeks = {};
            allDates.forEach(d => {
                const start = new Date(d.dateObj);
                start.setDate(d.dateObj.getDate() - (d.dateObj.getDay() === 0 ? 6 : d.dateObj.getDay() - 1));
                const weekKey = start.toISOString().split('T')[0];
                if(!weeks[weekKey]) weeks[weekKey] = [];
                weeks[weekKey].push(d);
            });

            for(const w in weeks) {
                let max = 0; let winners = [];
                weeks[w].forEach(d => {
                    const count = (globalData[d.id]?.present || []).length;
                    if(count > max) { max = count; winners = [d]; }
                    else if(count === max && max > 0) { winners.push(d); }
                });

                if(winners.length > 0) {
                    const div = document.createElement('div');
                    div.className = "bg-slate-900 rounded-2xl p-4 border border-slate-800";
                    let h = `<div class="text-slate-500 text-[9px] font-black uppercase mb-2">Semaine du ${new Date(w).toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}</div>`;
                    winners.forEach(win => {
                        h += `<div class="flex justify-between items-center border-l-2 border-yellow-400 pl-3 mb-2 last:mb-0">
                            <div>
                                <div class="font-bold text-sm text-white">${win.fullLabel}</div>
                                <div class="text-[9px] text-slate-400">${(globalData[win.id].present).join(', ')}</div>
                            </div>
                            <div class="text-green-400 font-black text-sm">${max} OK</div>
                        </div>`;
                    });
                    div.innerHTML = h;
                    results.appendChild(div);
                }
            }
        }
    </script>
</body>
</html>
