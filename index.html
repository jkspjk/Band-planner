<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Sync Live 🤘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="text"] { font-size: 16px !important; }
        .modal { display: none; position: fixed; inset: 0; background: #020617; z-index: 50; overflow-y: auto; }
        .modal.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-white p-4 font-sans pb-24">
    
    <div id="mainPage" class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-black italic text-yellow-400 leading-none">BAND SYNC</h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-widest mt-1 text-left">Live • 19h-21h</p>
            </div>
            <button onclick="toggleTopPage()" class="bg-yellow-400 text-black px-3 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">🏆 Top / Semaine</button>
        </header>

        <section class="mb-6 bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-2xl text-left">
            <label class="text-[10px] uppercase font-bold text-slate-500 ml-1">Qui vote ?</label>
            <input id="nameInput" type="text" placeholder="Ton prénom..." 
                class="w-full bg-transparent text-xl font-bold outline-none text-yellow-100 placeholder:text-slate-800">
        </section>

        <div id="calendarGrid" class="grid grid-cols-2 gap-3"></div>

        <div class="fixed bottom-4 left-0 right-0 px-4 pointer-events-none">
            <div class="max-w-md mx-auto bg-slate-900/90 backdrop-blur border border-slate-700 text-white text-[10px] text-center py-3 rounded-2xl font-bold uppercase tracking-tight shadow-2xl pointer-events-auto">
                1 clic = <span class="text-green-400">OK</span> | 2 clics = <span class="text-red-400">ABS</span>
            </div>
        </div>
    </div>

    <div id="topPage" class="modal p-6 text-left">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black italic text-yellow-400">TOP DATES</h2>
                <button onclick="toggleTopPage()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase">Retour</button>
            </div>
            <div id="topResults" class="space-y-6"></div>
        </div>
    </div>

    <script type="module">
        // --- CONFIGURATION FIREBASE ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCPiwhmVw5ueWMjfqdXy5SyXszWYrnWeEU",
  authDomain: "band-planner-4c85a.firebaseapp.com",
  projectId: "band-planner-4c85a",
  storageBucket: "band-planner-4c85a.firebasestorage.app",
  messagingSenderId: "84077122024",
  appId: "1:84077122024:web:da8e368b73901dc324945d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LOGIQUE APPLI ---
        const grid = document.getElementById('calendarGrid');
        const nameInput = document.getElementById('nameInput');
        let globalData = {};

        nameInput.value = localStorage.getItem('bandUserName') || "";
        nameInput.oninput = () => localStorage.setItem('bandUserName', nameInput.value);

        const dates = Array.from({length: 90}, (_, i) => {
            const d = new Date();
            d.setDate(d.getDate() + i);
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
            
            return { 
                id: d.toISOString().split('T')[0], 
                label: d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }),
                week: `${d.getFullYear()}-W${weekNo}`,
                fullLabel: d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })
            };
        });

        // Écouter Firebase en temps réel
        onSnapshot(doc(db, "band", "calendar"), (docSnap) => {
            globalData = docSnap.exists() ? docSnap.data() : {};
            renderCalendar();
        });

        window.toggleDate = async (dateId) => {
            const name = nameInput.value.trim();
            if (!name) return alert("Ton prénom !");

            if (!globalData[dateId]) globalData[dateId] = { present: [], absent: [] };
            let { present, absent } = globalData[dateId];

            if (!present.includes(name) && !absent.includes(name)) {
                present.push(name);
            } else if (present.includes(name)) {
                present = present.filter(u => u !== name);
                absent.push(name);
            } else {
                absent = absent.filter(u => u !== name);
            }

            await setDoc(doc(db, "band", "calendar"), { ...globalData, [dateId]: { present, absent } });
        };

        function renderCalendar() {
            grid.innerHTML = '';
            const myName = nameInput.value.trim().toLowerCase();

            dates.forEach(date => {
                const day = globalData[date.id] || { present: [], absent: [] };
                const isMeP = myName && day.present.some(u => u.toLowerCase() === myName);
                const isMeA = myName && day.absent.some(u => u.toLowerCase() === myName);
                
                let style = 'border-slate-800 bg-slate-900/50';
                if (isMeP) style = 'border-green-500 bg-green-500/10 ring-1 ring-green-500';
                if (isMeA) style = 'border-red-500 bg-red-500/10 ring-1 ring-red-500';

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border-2 transition-all active:scale-95 flex flex-col justify-between min-h-[120px] ${style}`;
                card.innerHTML = `
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-500 text-left">${date.label}</div>
                        <div class="flex gap-3 mt-1">
                            <div class="text-xl font-black text-green-400">${day.present.length}<span class="text-[10px] ml-1 opacity-50 uppercase">Ok</span></div>
                            <div class="text-xl font-black text-red-500">${day.absent.length}<span class="text-[10px] ml-1 opacity-50 uppercase">No</span></div>
                        </div>
                    </div>
                    <div class="text-[9px] font-medium text-slate-400 mt-2 text-left">
                        <span class="text-green-500/80">${day.present.join(', ')}</span>
                        ${day.absent.length > 0 ? '<br><span class="text-red-500/60 font-bold">ABS: ' + day.absent.join(', ') + '</span>' : ''}
                    </div>
                `;
                card.onclick = () => window.toggleDate(date.id);
                grid.appendChild(card);
            });
        }

        window.toggleTopPage = () => {
            const tp = document.getElementById('topPage');
            if(tp.classList.toggle('active')) calculateBest();
        };

        function calculateBest() {
            const results = document.getElementById('topResults');
            results.innerHTML = '';
            const weeks = {};
            dates.forEach(d => { if(!weeks[d.week]) weeks[d.week] = []; weeks[d.week].push(d); });

            for(const w in weeks) {
                let max = 0; let winners = [];
                weeks[w].forEach(d => {
                    const count = (globalData[d.id]?.present || []).length;
                    if(count > max) { max = count; winners = [d]; }
                    else if(count === max && max > 0) { winners.push(d); }
                });

                if(winners.length > 0) {
                    const div = document.createElement('div');
                    div.className = "bg-slate-900 rounded-3xl p-5 border border-slate-800 text-left";
                    let h = `<h3 class="text-slate-500 text-[10px] font-bold uppercase mb-3">Semaine ${w.split('-W')[1]}</h3>`;
                    winners.forEach(win => {
                        h += `<div class="mb-3 last:mb-0 border-l-2 border-yellow-400 pl-3">
                            <div class="font-bold text-white">${win.fullLabel}</div>
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] text-slate-400">${(globalData[win.id].present).join(', ')}</span>
                                <span class="text-green-400 font-black">${max} OK</span>
                            </div>
                        </div>`;
                    });
                    div.innerHTML = h;
                    results.appendChild(div);
                }
            }
        }
    </script>
</body>
</html>
