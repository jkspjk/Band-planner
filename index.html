<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Sync Pro 🎸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TON_API_KEY",
            authDomain: "TON_PROJET.firebaseapp.com",
            projectId: "TON_PROJET_ID",
            storageBucket: "TON_PROJET.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const grid = document.getElementById('calendarGrid');
        const nameInput = document.getElementById('nameInput');
        let globalData = {};

        nameInput.value = localStorage.getItem('bandUserName') || "";
        nameInput.oninput = () => {
            localStorage.setItem('bandUserName', nameInput.value);
            renderCalendar();
        };

        const dates = Array.from({length: 30}, (_, i) => {
            const d = new Date();
            d.setDate(d.getDate() + i);
            return { id: d.toISOString().split('T')[0], label: d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) };
        });

        onSnapshot(doc(db, "band", "calendar"), (docSnap) => {
            globalData = docSnap.exists() ? docSnap.data() : {};
            renderCalendar();
        });

        window.resetData = async () => {
            if(confirm("Vider tout le calendrier ?")) {
                await setDoc(doc(db, "band", "calendar"), {});
            }
        };

        async function toggleDate(dateId) {
            const name = nameInput.value.trim();
            if (!name) return alert("Ton prénom ?");
            let users = globalData[dateId] || [];
            users = users.includes(name) ? users.filter(u => u !== name) : [...users, name];
            await setDoc(doc(db, "band", "calendar"), { ...globalData, [dateId]: users });
        }

        function renderCalendar() {
            grid.innerHTML = '';
            const myName = nameInput.value.trim();

            dates.forEach(date => {
                const users = globalData[date.id] || [];
                const isMe = myName && users.includes(myName);
                const isDrummerPresent = users.some(u => u.toLowerCase().includes('batteur') || u.toLowerCase().includes('drums'));
                
                const card = document.createElement('div');
                const stateClass = users.length >= 7 ? 'bg-green-600 border-green-400' : 
                                  users.length > 0 ? 'bg-slate-800 border-slate-700' : 'bg-slate-900 border-slate-800';

                card.className = `p-4 rounded-2xl border-2 transition-all active:scale-95 flex flex-col justify-between min-h-[130px] shadow-lg ${stateClass} ${isMe ? 'ring-2 ring-yellow-400' : ''}`;
                
                card.innerHTML = `
                    <div class="relative">
                        <div class="text-[10px] uppercase font-bold text-slate-400">${date.label}</div>
                        <div class="text-2xl font-black">${users.length}/7</div>
                        ${users.length > 0 && !isDrummerPresent ? '<span class="absolute top-0 right-0 text-xs">⚠️🥁</span>' : ''}
                    </div>
                    <div class="text-[10px] font-medium italic text-slate-400 leading-tight">
                        ${users.length > 0 ? users.join(', ') : 'Libre'}
                    </div>
                `;

                card.onclick = () => toggleDate(date.id);
                grid.appendChild(card);
            });
        }
    </script>
</head>
<body class="bg-slate-950 text-white p-4 font-sans pb-24">
    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-start mb-6">
            <div>
                <h1 class="text-3xl font-black italic text-yellow-400">BAND SYNC</h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-widest">19h-21h • Temps Réel</p>
            </div>
            <button onclick="resetData()" class="bg-slate-800 p-2 rounded-lg text-xs text-slate-500 hover:text-red-400">Effacer</button>
        </div>

        <section class="mb-6 bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-2xl">
            <input id="nameInput" type="text" placeholder="Ton prénom..." 
                class="w-full bg-transparent text-xl font-bold outline-none text-yellow-100 placeholder:text-slate-800">
        </section>

        <div id="calendarGrid" class="grid grid-cols-2 gap-3"></div>
    </div>
</body>
</html>
