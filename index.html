<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Sync Live 🤘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="text"] { font-size: 16px !important; }
        .modal { display: none; position: fixed; inset: 0; background: #020617; z-index: 50; overflow-y: auto; }
        .modal.active { display: block; }
        /* Style pour masquer la scrollbar mais garder le défilement */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans pb-24">
    
    <div id="mainPage" class="max-w-xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-black italic text-yellow-400 leading-none">BAND SYNC</h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-widest mt-1 text-left">Live • 19h-21h</p>
            </div>
            <button onclick="toggleTopPage()" class="bg-yellow-400 text-black px-3 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">🏆 Top / Semaine</button>
        </header>

        <section class="mb-8 bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-2xl text-left">
            <label class="text-[10px] uppercase font-bold text-slate-500 ml-1">Qui vote ?</label>
            <input id="nameInput" type="text" placeholder="Ton prénom..." 
                class="w-full bg-transparent text-xl font-bold outline-none text-yellow-100 placeholder:text-slate-800">
        </section>

        <div id="calendarContainer" class="space-y-8">
            </div>

        <div class="fixed bottom-4 left-0 right-0 px-4 pointer-events-none">
            <div class="max-w-md mx-auto bg-slate-900/90 backdrop-blur border border-slate-700 text-white text-[10px] text-center py-3 rounded-2xl font-bold uppercase tracking-tight shadow-2xl pointer-events-auto">
                1 clic = <span class="text-green-400">OK</span> | 2 clics = <span class="text-red-400">ABS</span>
            </div>
        </div>
    </div>

    <div id="topPage" class="modal p-6 text-left">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black italic text-yellow-400">TOP DATES</h2>
                <button onclick="toggleTopPage()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase">Retour</button>
            </div>
            <div id="topResults" class="space-y-6"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- CONFIGURATION FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyCPiwhmVw5ueWMjfqdXy5SyXszWYrnWeEU",
  authDomain: "band-planner-4c85a.firebaseapp.com",
  projectId: "band-planner-4c85a",
  storageBucket: "band-planner-4c85a.firebasestorage.app",
  messagingSenderId: "84077122024",
  appId: "1:84077122024:web:da8e368b73901dc324945d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById('calendarContainer');
        const nameInput = document.getElementById('nameInput');
        let globalData = {};

        nameInput.value = localStorage.getItem('bandUserName') || "";
        nameInput.oninput = () => localStorage.setItem('bandUserName', nameInput.value);

        // Génération des dates sur 90 jours
        const getDatesData = () => {
            const days = [];
            for (let i = 0; i < 90; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                
                // Calcul de la semaine ISO
                const tempDate = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
                tempDate.setUTCDate(tempDate.getUTCDate() + 4 - (tempDate.getUTCDay() || 7));
                const yearStart = new Date(Date.UTC(tempDate.getUTCFullYear(), 0, 1));
                const weekNo = Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);

                days.push({
                    id: d.toISOString().split('T')[0],
                    dayName: d.toLocaleDateString('fr-FR', { weekday: 'short' }),
                    dayNum: d.getDate(),
                    monthName: d.toLocaleDateString('fr-FR', { month: 'long' }),
                    fullMonth: d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }),
                    weekKey: `${d.getFullYear()}-W${weekNo}`,
                    fullLabel: d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })
                });
            }
            return days;
        };

        const allDates = getDatesData();

        onSnapshot(doc(db, "band", "calendar"), (docSnap) => {
            globalData = docSnap.exists() ? docSnap.data() : {};
            renderCalendar();
        });

        window.toggleDate = async (dateId) => {
            const name = nameInput.value.trim();
            if (!name) return alert("Indique ton prénom !");
            if (!globalData[dateId]) globalData[dateId] = { present: [], absent: [] };
            let { present, absent } = globalData[dateId];
            if (!present.includes(name) && !absent.includes(name)) { present.push(name); }
            else if (present.includes(name)) { present = present.filter(u => u !== name); absent.push(name); }
            else { absent = absent.filter(u => u !== name); }
            await setDoc(doc(db, "band", "calendar"), { ...globalData, [dateId]: { present, absent } });
        };

        function renderCalendar() {
            container.innerHTML = '';
            const myName = nameInput.value.trim().toLowerCase();
            
            // Grouper par mois puis par semaine
            const months = {};
            allDates.forEach(d => {
                if (!months[d.fullMonth]) months[d.fullMonth] = {};
                if (!months[d.fullMonth][d.weekKey]) months[d.fullMonth][d.weekKey] = [];
                months[d.fullMonth][d.weekKey].push(d);
            });

            for (const monthName in months) {
                // Titre du Mois
                const monthHeader = document.createElement('div');
                monthHeader.className = "text-xl font-black uppercase tracking-tighter text-yellow-400 border-b border-yellow-400/20 pb-2 mb-4 mt-8 sticky top-0 bg-slate-950/90 backdrop-blur z-10";
                monthHeader.innerText = monthName;
                container.appendChild(monthHeader);

                for (const weekKey in months[monthName]) {
                    const weekDays = months[monthName][weekKey];
                    
                    const weekRow = document.createElement('div');
                    weekRow.className = "mb-6";
                    
                    const weekTitle = document.createElement('div');
                    weekTitle.className = "text-[9px] uppercase font-bold text-slate-600 mb-2 ml-1";
                    weekTitle.innerText = `Semaine ${weekKey.split('-W')[1]}`;
                    weekRow.appendChild(weekTitle);

                    const daysGrid = document.createElement('div');
                    daysGrid.className = "grid grid-cols-7 gap-1 md:gap-2";

                    weekDays.forEach(date => {
                        const dayData = globalData[date.id] || { present: [], absent: [] };
                        const isMeP = myName && dayData.present.some(u => u.toLowerCase() === myName);
                        const isMeA = myName && dayData.absent.some(u => u.toLowerCase() === myName);
                        
                        let bg = 'bg-slate-900/40 border-slate-800';
                        if (isMeP) bg = 'bg-green-500/20 border-green-500 ring-1 ring-green-500';
                        if (isMeA) bg = 'bg-red-500/20 border-red-500 ring-1 ring-red-500';

                        const dayCard = document.createElement('div');
                        dayCard.className = `flex flex-col items-center justify-center p-2 rounded-xl border-2 transition-all active:scale-90 cursor-pointer min-h-[80px] ${bg}`;
                        dayCard.onclick = () => window.toggleDate(date.id);
                        
                        dayCard.innerHTML = `
                            <div class="text-[8px] uppercase font-bold text-slate-500 leading-none mb-1">${date.dayName}</div>
                            <div class="text-lg font-black leading-none mb-1">${date.dayNum}</div>
                            <div class="flex flex-col items-center gap-0.5 mt-1">
                                <div class="text-[10px] font-black text-green-400 leading-none">${dayData.present.length} <span class="text-[7px] opacity-40">OK</span></div>
                                <div class="text-[10px] font-black text-red-500 leading-none">${dayData.absent.length} <span class="text-[7px] opacity-40">NO</span></div>
                            </div>
                        `;
                        daysGrid.appendChild(dayCard);
                    });
                    
                    weekRow.appendChild(daysGrid);
                    container.appendChild(weekRow);
                }
            }
        }

        window.toggleTopPage = () => {
            const tp = document.getElementById('topPage');
            if(tp.classList.toggle('active')) calculateBest();
        };

        function calculateBest() {
            const results = document.getElementById('topResults');
            results.innerHTML = '';
            const weeks = {};
            allDates.forEach(d => { if(!weeks[d.weekKey]) weeks[d.weekKey] = []; weeks[d.weekKey].push(d); });

            for(const w in weeks) {
                let max = 0; let winners = [];
                weeks[w].forEach(d => {
                    const count = (globalData[d.id]?.present || []).length;
                    if(count > max) { max = count; winners = [d]; }
                    else if(count === max && max > 0) { winners.push(d); }
                });

                if(winners.length > 0) {
                    const div = document.createElement('div');
                    div.className = "bg-slate-900 rounded-3xl p-5 border border-slate-800 text-left";
                    let h = `<h3 class="text-slate-500 text-[10px] font-bold uppercase mb-3 text-left">Semaine ${w.split('-W')[1]}</h3>`;
                    winners.forEach(win => {
                        h += `<div class="mb-3 last:mb-0 border-l-2 border-yellow-400 pl-3">
                            <div class="font-bold text-white text-left">${win.fullLabel}</div>
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] text-slate-400">${(globalData[win.id].present).join(', ')}</span>
                                <span class="text-green-400 font-black">${max} OK</span>
                            </div>
                        </div>`;
                    });
                    div.innerHTML = h;
                    results.appendChild(div);
                }
            }
        }
    </script>
</body>
</html>
